version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8nback-postgres
    environment:
      POSTGRES_USER: n8nback
      POSTGRES_PASSWORD: n8nback_dev_password
      POSTGRES_DB: n8nback
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8nback"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: n8nback-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-n8n:
    build:
      context: ../apps/mock-n8n
      dockerfile: ../../infra/Dockerfile.mock-n8n
    container_name: n8nback-mock-n8n
    ports:
      - "5679:5678"
    environment:
      PORT: 5678
      HOST: 0.0.0.0

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: n8nback-api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://n8nback:n8nback_dev_password@postgres:5432/n8nback
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      WEB_URL: http://localhost:3000
      MOCK_N8N_URL: http://mock-n8n:5678
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: n8nback-worker
    environment:
      DATABASE_URL: postgresql://n8nback:n8nback_dev_password@postgres:5432/n8nback
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      POLL_INTERVAL_MS: 60000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: n8nback-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
